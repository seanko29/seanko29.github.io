[package]
name = "chiikawa-pet"
version = "0.1.0"
description = "A cute 2D desktop pet that types along with you."
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chiikawa_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
